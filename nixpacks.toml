# Railway / Nixpacks: Node app + Python stack for voice_embedding.py (pyannote / torch CPU).
# HF_TOKEN must still be set in Railway variables; accept model terms on Hugging Face.
#
# `ffmpeg` is required for long lectures (>10 min chunking), Whisper file compression, and voice preprocessing.
# If the deploy uses a builder without Nixpacks, install ffmpeg on the image or set FFMPEG_PATH / FFPROBE_PATH.

[phases.setup]
nixPkgs = ["...", "python311", "ffmpeg"]

[phases.install]
cmds = [
  "...",
  # Nix python311 has no pip module by default — bootstrap pip (stdlib only), then voice deps.
  "python3 -c \"import urllib.request; open('/tmp/get-pip.py','wb').write(urllib.request.urlopen('https://bootstrap.pypa.io/get-pip.py').read())\" && python3 /tmp/get-pip.py --user",
  "python3 -m pip install --user --upgrade pip setuptools wheel",
  "python3 -m pip install --user -r server/requirements-voice.txt || PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --user -r server/requirements-voice.txt",
]

[variables]
PYTHONUNBUFFERED = "1"
