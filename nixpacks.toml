# Railway / Nixpacks: Node app + Python stack for voice_embedding.py (pyannote / torch CPU).
# HF_TOKEN must still be set in Railway variables; accept model terms on Hugging Face.
#
# `ffmpeg` is required for long lectures (>10 min chunking), Whisper file compression, and voice preprocessing.
# If the deploy uses a builder without Nixpacks, install ffmpeg on the image or set FFMPEG_PATH / FFPROBE_PATH.

[phases.setup]
nixPkgs = ["...", "python311", "ffmpeg"]

[phases.install]
cmds = [
  "...",
  # Nix python is PEP 668 "externally managed" — install voice deps in a project venv (not system pip).
  "python3 -m venv .venv-voice",
  ".venv-voice/bin/python -m pip install --upgrade pip setuptools wheel",
  ".venv-voice/bin/python -m pip install -r server/requirements-voice.txt",
]

[variables]
PYTHONUNBUFFERED = "1"
# Used by server/utils/voiceRecognition.js (resolved relative to process.cwd() at runtime).
PYTHON_BIN = ".venv-voice/bin/python"
